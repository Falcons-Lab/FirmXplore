[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmxplore"
version = "0.1.0"
description = "FirmXplore: Firmware eXploration and Vulnerability Analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "FirmXplore" }
]
license = { text = "MIT" }
dependencies = []

# 对外统一入口是 firmxplore；fwagent 保留为兼容别名（内部包名不变）
[project.scripts]
firmxplore = "fwagent.cli:main"
fwagent = "fwagent.cli:main"

[tool.setuptools.packages.find]
include = ["fwagent*"]

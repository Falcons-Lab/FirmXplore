services:
  firmxplore:
    build: .
    image: firmxplore:latest
    network_mode: "none"
    working_dir: /work
    volumes:
      - .:/work
    mem_limit: 2g
    pids_limit: 256
    cpus: 2
    entrypoint: ["firmxplore"]
  ghidra-base:
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    image: firmxplore-ghidra-base:latest
  ghidra-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.ghidra
    image: firmxplore-ghidra-worker:latest
    network_mode: "none"
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
    mem_limit: 8g
    pids_limit: 512
    cpus: 4
    entrypoint: ["entrypoint-ghidra"]
  dynamic-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dynamic
    image: firmxplore-dynamic:latest
    network_mode: "bridge"
    working_dir: /work
    volumes:
      - .:/work
    mem_limit: 4g
    cpus: 2
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    entrypoint: ["/opt/fwagent/dynamic-entrypoint.sh"]
